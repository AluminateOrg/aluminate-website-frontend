name: Website Frontend CI

on:
  pull_request:
    branches: [ production ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-website-frontend-ci
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aluminate-website-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker Image
        run: |
          docker build --pull \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }} \
            --build-arg NEXT_PUBLIC_API_PREFIX=${{ secrets.NEXT_PUBLIC_API_PREFIX }} \
            --build-arg NEXT_PUBLIC_GLOBAL_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_GLOBAL_PUBLIC_KEY }} \
            --build-arg NEXT_PUBLIC_PAYHERE_MERCHANT_ID=${{ secrets.NEXT_PUBLIC_PAYHERE_MERCHANT_ID }} \
            --build-arg WEBSITE_FRONTEND_PORT=${{ secrets.WEBSITE_FRONTEND_PORT }} \
            -t aluminate/website-frontend:${{ github.sha }} \
            -t aluminate/website-frontend:latest \
            .

      - name: Comment PR on Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Website frontend build succeeded. Ready to merge to production.'
            })